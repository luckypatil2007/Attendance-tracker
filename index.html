
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Attendance Tracker</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="card">

    <div class="card-header">
      <div class="badge">STUDENT LOGIN</div>
      <h1 class="title">Welcome<br/><span>Back</span></h1>
      <p class="subtitle">Login to continue</p>
    </div>

    <div class="inputs">

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="e.g. student@gmail.com" />
        <span class="hint">Enter your email</span>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" />
        <span class="hint">Enter your password</span>
      </div>

    </div>

<button id="loginBtn" style="
  width:100%;
  padding:0.9rem 1.5rem;
  background:#e8c547;
  color:#0e0f14;
  border:none;
  border-radius:14px;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
">
Login->
</button>


    <div id="loginResult" class="result hidden"></div>

  </div>

  <script src="login.js"></script>

</body>
</html>
